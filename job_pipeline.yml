# Job orquestado del pipeline Medallion (cómputo serverless: no se define cluster).
resources:
  jobs:
    pipeline_ecommerce_medallion:
      name: pipeline_ecommerce_medallion
      description: "Ingesta Bronze (Auto Loader) → Silver (calidad) → Gold (KPIs) → Modelo (MLflow) → Beneficio/Costo"
      schedule:
        quartz_cron_expression: "0 0 6 * * ?"   # todos los días a las 6:00 a. m.
        timezone_id: America/Bogota
        pause_status: PAUSED                   # se deja en pausa para no gastar la cuota gratuita
      max_concurrent_runs: 1
      tasks:
        - task_key: bronze_ingesta
          notebook_task:
            notebook_path: ./02_bronze_ingesta.py
        - task_key: silver_limpieza
          depends_on: [{task_key: bronze_ingesta}]
          notebook_task:
            notebook_path: ./03_silver_limpieza.py
        - task_key: gold_agregados
          depends_on: [{task_key: silver_limpieza}]
          notebook_task:
            notebook_path: ./04_gold_agregados.py
        - task_key: modelo_ciencia_datos
          depends_on: [{task_key: gold_agregados}]
          notebook_task:
            notebook_path: ./05_modelo_ciencia_datos.py
        - task_key: beneficio_costo
          depends_on: [{task_key: gold_agregados}]
          notebook_task:
            notebook_path: ./06_beneficio_costo.py
